<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tengo una pregunta...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* CAMBIO: Aquí se añade la imagen de BMW y sus propiedades de ajuste */
            background-image: url('https://media.printler.com/media/photo/181303.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container {
            /* CAMBIO: Fondo semitransparente para que resalte sobre el coche */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
        }
        h1 {
            color: #d63031;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #si {
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
        }
        #si:hover {
            transform: scale(1.1);
        }
        #no {
            background-color: #e74c3c;
            color: white;
            position: absolute;
        }
        .heart {
            position: absolute;
            color: #d63031;
            animation: float 4s linear infinite;
            font-size: 24px;
            z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container" id="box">
        <h1 id="titulo">¿Quieres ser mi novia? ❤️</h1>
        <div class="buttons">
            <button id="si" onclick="aceptar()">SÍ</button>
            <button id="no" onmouseover="moverNo()">NO</button>
        </div>
    </div>

    <script>
        function moverNo() {
            const btnNo = document.getElementById('no');
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }

        function aceptar() {
            document.getElementById('titulo').innerText = "¡SABÍA QUE DIRÍAS QUE SÍ! 😍";
            document.getElementById('si').style.display = 'none';
            document.getElementById('no').style.display = 'none';
            setInterval(crearCorazon, 150);
        }

        function crearCorazon() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 4000);
        }
    </script>
</body>
</html>
